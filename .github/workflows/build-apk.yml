name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches
          key: android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts') }}
          restore-keys: android-${{ runner.os }}-

      - name: Install SDK components
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}" -name sdkmanager -type f -path '*/bin/*' 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under ${ANDROID_HOME:-$HOME/Android/Sdk}"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 从 Windows 提交时 git 不记录 x 位，否则 ./gradlew 会 exit 126
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minitavern-bridge-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Release APK (signed)
    runs-on: ubuntu-latest
    # 签名密钥只在本仓库自身的 main 推送时使用。
    # pull_request（含 fork）一律跳过，避免密钥被不受信任的代码接触。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 发布 Release 需要写权限；构建本身仍只需读。
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}" -name sdkmanager -type f -path '*/bin/*' 2>/dev/null | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret KEYSTORE_B64 未配置，无法签名构建"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.keystore
          chmod 600 keystore/release.keystore

      - name: Build signed release
        env:
          KEYSTORE_PATH: keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        env:
          KEYSTORE_PATH: keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools" -name apksigner -type f | sort | tail -1)"
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee cert.txt
          {
            echo "## 签名指纹"
            echo '```'
            grep -E 'SHA-256 digest|Signer #1 certificate DN' cert.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f keystore/release.keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: minitavern-bridge-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # ---- 发布 GitHub Release -------------------------------------------
      # 版本号以 build.gradle.kts 的 versionName 为准，避免两处不同步。
      - name: Resolve version
        id: ver
        run: echo "name=$(grep -oP 'versionName\s*=\s*\"\K[^\"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Package Windows scripts
        run: |
          set -euo pipefail
          cd ..
          mkdir -p dist/mtbridge
          cp windows/mtbridge.py windows/mtbridge_tui.py \
             windows/config.example.json windows/README.md windows/TUI.md dist/mtbridge/
          cd dist && zip -qr mtbridge-windows.zip mtbridge
          echo "打包完成：$(ls -lh mtbridge-windows.zip | awk '{print $5}')"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.name }}
          APKSIGNER_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail
          cd ..          # 本 job 默认 working-directory 是 android/，回到仓库根
          APKSIGNER="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools" -name apksigner -type f | sort | tail -1)"
          # 附件名固定，避免出现 app-release-1.apk 这种带流水号的重复资产
          cp "$APKSIGNER_PATH" "dist/mtbridge-${{ steps.ver.outputs.name }}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" \
              "dist/mtbridge-${{ steps.ver.outputs.name }}.apk" \
              "dist/mtbridge-windows.zip" --clobber
          else
            gh release create "$TAG" \
              --title "MiniTavern Bridge ${{ steps.ver.outputs.name }}" \
              --notes-file .github/release-notes.md \
              "dist/mtbridge-${{ steps.ver.outputs.name }}.apk" \
              "dist/mtbridge-windows.zip"
          fi
          echo "发布完成：$TAG"
