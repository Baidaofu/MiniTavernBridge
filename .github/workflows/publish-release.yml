name: Publish Release

# 只能手动触发。发布动作需要人确认，避免「推个代码就把包发出去了」。
#
# 流程：Build APK 跑出产物 → 在 Actions 页面确认没问题 → 手动触发本工作流，
# 指定那次 run 的 id，本工作流会**原样取用那个已测过的 APK** 发到 Release，
# 不会重新构建。发布���的版本号取自产物里的 VERSION 文件（构建时写入），
# 因此和 APK 实际版本一定一致。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build APK 的 run id（留空 = 取最近一次成功的）'
        required: false
        type: string
      tag:
        description: 'Release tag（留空 = v<产物版本号>）'
        required: false
        type: string
      dry_run:
        description: '演练：只检查并打印，不实际创建 Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 创建/更新 Release
  actions: read     # 读取别的 run 的产物

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史与 tag：更新日志要从上一个 tag 拉到目标 commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build run
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN" ]; then
            RUN_ID="$INPUT_RUN"
            echo "使用指定的 run: $RUN_ID"
          else
            RUN_ID=$(gh run list --workflow build-apk.yml --status success \
                      --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$RUN_ID" ] || { echo "::error::没有成功的 Build APK 运行"; exit 1; }
            echo "自动选中最近一次成功的 run: $RUN_ID"
          fi
          SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha')
          gh run view "$RUN_ID" --json headSha,displayTitle,conclusion \
            --jq '"  提交 \(.headSha[0:7])  \(.displayTitle)  [\(.conclusion)]"'
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # 关键：取用构建时的那个 APK，本工作流不碰编译
      - name: Download APK from that run
        uses: actions/download-artifact@v4
        with:
          name: minitavern-bridge-release
          path: dist/apk
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version and rename asset
        id: ver
        run: |
          set -euo pipefail
          test -f dist/apk/app-release.apk || { echo "::error::产物里没有 app-release.apk"; exit 1; }
          test -f dist/apk/VERSION           || { echo "::error::产物里没有 VERSION 文件"; exit 1; }
          VERSION="$(tr -d '[:space:]' < dist/apk/VERSION)"
          [ -n "$VERSION" ] || { echo "::error::VERSION 为空"; exit 1; }
          echo "  产物版本: $VERSION"
          # 移到 dist/ 根：后续 Publish 步骤会 cd dist 再用相对路径引用，
          # Summary 也从仓库根 ls dist/mtbridge-*.apk，两处都依赖它在这里。
          mv dist/apk/app-release.apk "dist/mtbridge-$VERSION.apk"
          rm -f dist/apk/VERSION
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Windows scripts
        run: |
          set -euo pipefail
          mkdir -p dist/mtbridge
          cp windows/mtbridge.py windows/mtbridge_tui.py \
             windows/config.example.json windows/README.md windows/TUI.md dist/mtbridge/
          (cd dist && zip -qr mtbridge-windows.zip mtbridge)
          echo "  Windows 包: $(ls -lh dist/mtbridge-windows.zip | awk '{print $5}')"

      # 说明正文存在版本库（方便评审与复用），仅把版本号占位符替换掉
      - name: Render release notes
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          sed 's/{{VERSION}}/'"$VERSION"'/g' .github/release-notes.md > dist/notes.md
          echo "  说明 $(wc -c < dist/notes.md) 字节"
          grep -q "{{VERSION}}" dist/notes.md && { echo "::error::仍有未替换的占位符"; exit 1; } || true

      # 从上一个 tag 拉到「被构建的那个 commit」，按类型分组。
      # release-notes.md 本身是静态安装手册，只靠它无法看出版本间差异，
      # 所以这里的更新日志从 git 历史自动生成，不会与实际提交脱节。
      - name: Generate changelog
        env:
          SHA: ${{ steps.pick.outputs.sha }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          # git log 输出 UTF-8，grep/sed 里的中文模式依赖 locale，
          # runner 默认可能是 C，必须显式指定
          export LC_ALL=C.UTF-8

          # 上一个 tag：按时间取最近的，并排除本次要发的那个。
          # 仓库里只有 v1.0.0 而又是在重发 1.0.0 时，排除后会得到空，
          # 此时回退到「该版本自身的 tag」也没意义（范围会为空），
          # 因此额外保留一个判断：没有其它 tag 就当作首个版本。
          PREV=$(git tag --list 'v*' --sort=-creatordate \
                 | grep -vx "v${VERSION}" | head -1 || true)
          RANGE="${PREV:+$PREV..}$SHA"
          echo "  产物版本: $VERSION"
          echo "  更新日志范围: $RANGE"

          {
            echo
            echo "---"
            echo
            echo "## 更新日志"
            echo
            if [ -z "$PREV" ]; then
              if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
                echo "重发 \`v${VERSION}\`：除本次修复外无其它版本可对比。"
              else
                echo "首个版本，无历史提交可比对。"
              fi
            else
              echo "自 \`$PREV\` 起："
              echo
              # 过滤掉纯噪声的提交
              git log --no-merges --pretty='%s' "$RANGE" \
                | grep -vE '^(chore|ci)(\([^)]*\))?: (bump|release|忽略|更新)' \
                > /tmp/commits.txt || true

              TYPES='feat|fix|ui|perf|refactor|docs|test|style|ci|chore'
              KNOWN="^($TYPES)(\\([^)]*\\))?: "

              emit() {   # $1=类型前缀(空=其他)  $2=小节标题
                local pat="$1" title="$2" n
                if [ -n "$pat" ]; then
                  n=$(grep -cE "^${pat}(\\([^)]*\\))?: " /tmp/commits.txt || true)
                  [ "$n" -gt 0 ] || return 0
                  echo "### $title（$n）"
                  echo
                  grep -E "^${pat}(\\([^)]*\\))?: " /tmp/commits.txt \
                    | sed -E "s/^${pat}(\\([^)]*\\))?: /  - /"
                  echo
                else
                  # 「其他」= 前面所有类型都不匹配的，不能与上面的小节重复
                  n=$(grep -cvE "$KNOWN" /tmp/commits.txt || true)
                  [ "$n" -gt 0 ] || return 0
                  echo "### $title（$n）"
                  echo
                  grep -vE "$KNOWN" /tmp/commits.txt | sed 's/^/  - /'
                  echo
                fi
              }

              emit feat     新增
              emit fix      修复
              emit ui       界面
              emit perf     性能
              emit refactor 重构
              emit docs     文档
              emit test     测试
              emit style    样式
              emit ci       构建与 CI
              emit chore    杂项
              emit ""        其他

              [ -s /tmp/commits.txt ] || echo "本次发布没有面向用户的改动。"
            fi
          } >> dist/notes.md

          echo "  说明现为 $(wc -c < dist/notes.md) 字节"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || format('v{0}', steps.ver.outputs.name) }}
          VERSION: ${{ steps.ver.outputs.name }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          cd dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件与说明"
            gh release upload "$TAG" "mtbridge-$VERSION.apk" mtbridge-windows.zip --clobber
            gh release edit "$TAG" --title "MiniTavern Bridge $VERSION" --notes-file notes.md
          else
            # --target 指向被构建的那个 commit：发布时即使仓库又前进了，
            # tag 也不会落在比 APK 更新的提交上。
            gh release create "$TAG" \
              --target "$SHA" \
              --title "MiniTavern Bridge $VERSION" \
              --notes-file notes.md \
              "mtbridge-$VERSION.apk" mtbridge-windows.zip
          fi
          echo "发布完成：$TAG"

      - name: Summary (dry run)
        if: ${{ inputs.dry_run }}
        env:
          # 注意：GitHub 表达式不支持 sha[0:7] 这种切片，会导致工作流
          # 校验失败（startup_failure，连 job 都不会创建）。截断放到 shell 里做。
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          SHORT_SHA="$(printf '%.7s' "$SHA")"
          {
            echo "## 演练模式，未实际发布"
            echo
            echo "- 来源 run: \`${{ steps.pick.outputs.run_id }}\`"
            echo "- 产物版本: \`${{ steps.ver.outputs.name }}\`"
            echo "- 将要创建的 tag: \`${{ inputs.tag || format('v{0}', steps.ver.outputs.name) }}\`"
            echo "- tag 指向 commit: \`$SHORT_SHA\`"
            echo
            echo "### 附件"
            echo '```'
            ls -lh dist/mtbridge-*.apk dist/mtbridge-windows.zip 2>/dev/null \
              | awk '{print $5, $9}' || echo "  (未找到产物)"
            echo '```'
            echo
            echo "### 说明预览"
            echo '```'
            cat dist/notes.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
