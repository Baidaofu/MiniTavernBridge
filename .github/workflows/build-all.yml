name: Build APK + Windows GUI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'windows/**'
      - '.github/workflows/build-all.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'windows/**'
      - '.github/workflows/build-all.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}" -name sdkmanager -type f -path '*/bin/*' 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Windows 提交不保留 x 位，CI 上补回来
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  exe:
    name: Windows single-file GUI exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build single-file exe
        working-directory: windows
        run: python -m PyInstaller --onefile --windowed --clean --name mtbridge-gui --distpath dist --workpath build --specpath . mtbridge_gui.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: mtbridge-gui
          path: windows/dist/mtbridge-gui.exe
          retention-days: 30
